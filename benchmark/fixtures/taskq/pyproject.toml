[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taskq"
version = "0.6.0"
description = "A small in-process task queue with priorities, retries and JSON persistence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["taskq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
