[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shopcart"
version = "1.4.2"
description = "Cart, pricing, coupon and checkout primitives for small web shops"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["shopcart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
