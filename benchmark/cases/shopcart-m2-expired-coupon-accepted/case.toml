id = "shopcart-m2-expired-coupon-accepted"
fixture = "shopcart"
difficulty = "medium"
kind = "fix"
expected_classification = "fixable"
root_cause_category = "logic_error"
notes = "Reference fix: shopcart/utils/dates.py is_expired compares `remaining.seconds < 0`, which is never true (timedelta.seconds is always >= 0). Use remaining.total_seconds() < 0 (or compare now > deadline). Checkout -> CouponBook.validate -> is_expired; discounts.py and checkout.py are correct."

[issue]
number = 111
title = "Expired coupon codes are still accepted at checkout"
labels = ["bug", "coupons"]
body = '''
Our SPRING15 coupon ended on 2024-04-30, but customers kept using it all through May and checkout happily applied the 15% discount.

```python
from datetime import datetime
from decimal import Decimal
from shopcart import Cart, Checkout, Product
from shopcart.discounts import Coupon, CouponBook
from shopcart.inventory import Inventory
from shopcart.payments.gateway import FakeGateway

book = CouponBook([Coupon("SPRING15", 15, expires_on="2024-04-30")])
checkout = Checkout(
    Inventory({"KTL-02": 10}),
    FakeGateway(),
    coupons=book,
    clock=lambda: datetime(2024, 5, 20, 14, 0),
)
cart = Cart()
cart.add(Product("KTL-02", "Stovetop kettle", Decimal("39.00"), weight_kg=1.3))

print(checkout.quote(cart, "SPRING15").discount_cents)   # 585, expected CouponExpired
```

I'd expect `CouponExpired` to be raised here, the same way an unknown code raises `UnknownCoupon`, and `place_order` should refuse the order. The back-office coupon list (which shows `CouponBook.active()`) also still lists SPRING15 as active three weeks after it ended.

We double-checked the data: `book.get("SPRING15").expires_on` is `datetime.date(2024, 4, 30)`, so the date is parsed fine. A coupon should keep working through its last day; it just shouldn't work after that.
'''

[[inject]]
file = "shopcart/utils/dates.py"
search = '''
    return remaining.total_seconds() < 0
'''
replace = '''
    return remaining.seconds < 0
'''

[expected]
files = ["shopcart/utils/dates.py"]
symbols = ["is_expired"]
forbidden_paths = ["shopcart/payments/**", "shopcart/migrations/**"]
max_diff_lines = 12
