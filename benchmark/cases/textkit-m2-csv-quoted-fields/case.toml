    Fields may be wrapped in ``quotechar``.
    """
    line = line.rstrip("\r\n")
    fields: list[str] = []
    for raw in line.split(delimiter):
        if len(raw) >= 2 and raw[0] == quotechar and raw[-1] == quotechar:
            raw = raw[1:-1]
        fields.append(raw)
    return fields
'''

