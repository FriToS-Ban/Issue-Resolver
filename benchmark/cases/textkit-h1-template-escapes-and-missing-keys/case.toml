[issue]
number = 119
title = "Templates: no way to write literal braces, and missing values raise a bare KeyError"
labels = ["bug", "enhancement"]
body = '''
Two problems with `textkit.render` that are biting us now that we generate small JSON and CSS snippets from templates.

**1. Literal braces.** There is no way to output a `{` or `}`. The usual `str.format` convention of doubling them doesn't work:

```
>>> from textkit import render
>>> render('{{"id": {id}}}', id=5)
'{{"id": 5}}'
>>> render("{{name}}", name="x")
'{x}'
```

Expected `'{"id": 5}'` and `'{name}'` (the doubled braces being literal text), the same as `str.format` would give. `placeholders()` and `missing_keys()` should also not report names that only appear inside escaped braces.

**2. Missing values.** When a value is missing, the error is a bare `KeyError` that only contains the last segment of the name, which is useless in our logs, and the `textkit render` command dumps a traceback instead of printing an error:

```
>>> render("Order {order.id} shipped to {customer}", order={"status": "sent"}, customer="Ada")
Traceback (most recent call last):
  File "<stdin>", line 1, in <module>
  File "textkit/template.py", line 40, in render
    return _TOKEN_RE.sub(substitute, template)
           ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  File "textkit/template.py", line 38, in substitute
    return str(_lookup(data, match.group(1)))
               ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  File "textkit/template.py", line 19, in _lookup
    value = value[part]
            ~~~~~^^^^^^
KeyError: 'id'
```

We wrap all textkit calls in `except TextkitError`, and the CLI already turns `TextkitError` into a clean `textkit: error: ...` message with exit code 2. Missing values should raise textkit's own `TemplateError`, and the message should name the full placeholder that couldn't be filled (`order.id` here, not just `id`).
'''

