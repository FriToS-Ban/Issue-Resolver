[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fix-issue"
version = "0.1.0"
description = "Autonomous GitHub Issue Resolution Agent — fetches, triages, patches, and PRs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["github", "llm", "automation", "devtools", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Bug Tracking",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# No vendor LLM SDK — all API calls go through plain `requests`.
dependencies = [
    "requests>=2.31",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
fix-issue = "fix_issue.cli:main"

[project.urls]
"Homepage" = "https://github.com/your-org/fix-issue"
"Bug Tracker" = "https://github.com/your-org/fix-issue/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fix_issue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["fix_issue"]
omit = ["tests/*"]
